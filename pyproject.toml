[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neutron-diffusion-solver"
version = "0.1.0"
description = "Teaching-oriented neutron diffusion and reactor physics solvers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "buzhidao2006"}]
dependencies = [
    "streamlit>=1.28.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]

[project.scripts]
neutron-diffusion = "main:main"

[tool.setuptools]
py-modules = [
    "app",
    "bateman",
    "boron_search",
    "burnup_solver",
    "convergence",
    "critical_size",
    "diffusion_1d",
    "diffusion_2d",
    "diffusion_2g",
    "diffusion_3d",
    "main",
    "plotting",
    "point_kinetics",
    "power_iteration",
    "resource_guards",
    "result_export",
    "solver",
    "solver_2d",
    "solver_3d",
    "visualization",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["neutron_diffusion_tutorial.ipynb", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
